name: Manual Automated Ingestion

on:
  workflow_dispatch:
    inputs:
      target_type:
        description: "Target type"
        required: true
        type: choice
        options:
          - portfolio
          - accounts
      integration:
        description: "Integration key"
        required: false
        default: ibkr_flex_ws
        type: string
      mode:
        description: "Run mode"
        required: true
        type: choice
        options:
          - dry-run
          - load
      start_date:
        description: "Start date (YYYY-MM-DD)"
        required: true
        type: string
      end_date:
        description: "End date (YYYY-MM-DD)"
        required: true
        type: string
      portfolio_name:
        description: "Portfolio name (required when target_type=portfolio)"
        required: false
        default: ""
        type: string
      account_external_ids:
        description: "Comma-separated account external IDs (required when target_type=accounts)"
        required: false
        default: ""
        type: string

jobs:
  ingest:
    name: Run ingestion (${{ inputs.target_type }} / ${{ inputs.mode }})
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      IBKR_FLEX_TOKEN: ${{ secrets.IBKR_FLEX_TOKEN }}
      IBKR_FLEX_QUERY_ID: ${{ secrets.IBKR_FLEX_QUERY_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run automated ingestion
        id: ingestion
        env:
          TARGET_TYPE: ${{ inputs.target_type }}
          INTEGRATION: ${{ inputs.integration }}
          MODE: ${{ inputs.mode }}
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
          PORTFOLIO_NAME: ${{ inputs.portfolio_name }}
          ACCOUNT_EXTERNAL_IDS: ${{ inputs.account_external_ids }}
        run: |
          EXTRA_FLAGS=()
          if [ -n "$PORTFOLIO_NAME" ]; then
            EXTRA_FLAGS+=(--portfolio-name "$PORTFOLIO_NAME")
          fi
          if [ -n "$ACCOUNT_EXTERNAL_IDS" ]; then
            EXTRA_FLAGS+=(--account-external-ids "$ACCOUNT_EXTERNAL_IDS")
          fi

          set +e
          python scripts/run_automated_ingestion.py \
            --target-type "$TARGET_TYPE" \
            --integration "$INTEGRATION" \
            --mode "$MODE" \
            --start-date "$START_DATE" \
            --end-date "$END_DATE" \
            "${EXTRA_FLAGS[@]}" 2>&1 | tee ingestion_output.txt
          CLI_EXIT=${PIPESTATUS[0]}
          set -e

          # Publish output to step summary (runs whether CLI succeeded or failed)
          echo "## Ingestion Run Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| target_type | $TARGET_TYPE |" >> "$GITHUB_STEP_SUMMARY"
          echo "| integration | $INTEGRATION |" >> "$GITHUB_STEP_SUMMARY"
          echo "| mode | $MODE |" >> "$GITHUB_STEP_SUMMARY"
          echo "| start_date | $START_DATE |" >> "$GITHUB_STEP_SUMMARY"
          echo "| end_date | $END_DATE |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### CLI Output" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat ingestion_output.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          exit $CLI_EXIT
